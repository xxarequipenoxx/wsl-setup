name: pr

# Thin caller of the reusable workflows of github-standards (README section 8 there). The
# logic lives in github-standards; Renovate proposes new release tags as pull requests.
#
# Status checks: commits / conventional commits, security / gitleaks, security / zizmor.
# These names are the project's required checks; auto-merge / auto-merge is never required.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commits:
    uses: xxarequipenoxx/github-standards/.github/workflows/commits.yml@v0.10.0
    permissions:
      contents: read
      pull-requests: read

  security:
    uses: xxarequipenoxx/github-standards/.github/workflows/security.yml@v0.10.0
    permissions:
      contents: read
      security-events: write

  # Not a required check: turns auto-merge on unless the pull request announces a
  # breaking change (auto-merge.yml in github-standards, secret AUTO_MERGE_TOKEN).
  auto-merge:
    uses: xxarequipenoxx/github-standards/.github/workflows/auto-merge.yml@v0.10.0
    permissions:
      contents: read
    secrets:
      token: ${{ secrets.AUTO_MERGE_TOKEN }}
